<!DOCTYPE html>
<html lang="hi-Latn" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Beam</title>
<link rel="icon" id="fav" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@400;600;700&family=Sora:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;600;700&family=Hind:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--font:"Manrope","Hind","Hind Siliguri",system-ui,"Segoe UI",sans-serif;--r:14px}
[data-theme=midnight]{--bg:#0b1017;--bg2:#121a24;--bg3:#19232f;--line:#243140;--ink:#e8eef5;--mute:#8394a7;--ac:#2dd4bf;--acink:#032b26;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#14b8a666,transparent 70%),radial-gradient(38% 42% at 92% 18%,#3b82f666,transparent 70%),radial-gradient(48% 42% at 68% 100%,#8b5cf666,transparent 70%),radial-gradient(30% 30% at 6% 80%,#3b82f666,transparent 70%)}
[data-theme=ocean]{--bg:#07111f;--bg2:#0d1d33;--bg3:#132a47;--line:#1c3a5e;--ink:#e4f1ff;--mute:#7a9cbd;--ac:#38bdf8;--acink:#02202f;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#06b6d466,transparent 70%),radial-gradient(38% 42% at 92% 18%,#6366f166,transparent 70%),radial-gradient(48% 42% at 68% 100%,#0ea5e966,transparent 70%),radial-gradient(30% 30% at 6% 80%,#6366f166,transparent 70%)}
[data-theme=violet]{--bg:#100c1f;--bg2:#19132f;--bg3:#231b40;--line:#342a5a;--ink:#efeaff;--mute:#9f94c7;--ac:#a78bfa;--acink:#190c3d;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#a855f766,transparent 70%),radial-gradient(38% 42% at 92% 18%,#ec489966,transparent 70%),radial-gradient(48% 42% at 68% 100%,#6366f166,transparent 70%),radial-gradient(30% 30% at 6% 80%,#ec489966,transparent 70%)}
[data-theme=sunset]{--bg:#160f12;--bg2:#21161a;--bg3:#2c1d23;--line:#422a33;--ink:#fdeee8;--mute:#b8979a;--ac:#fb923c;--acink:#2b1200;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#f973165c,transparent 70%),radial-gradient(38% 42% at 92% 18%,#ec48995c,transparent 70%),radial-gradient(48% 42% at 68% 100%,#eab3085c,transparent 70%),radial-gradient(30% 30% at 6% 80%,#ec48995c,transparent 70%)}
[data-theme=emerald]{--bg:#08130e;--bg2:#0f1f17;--bg3:#162c21;--line:#234032;--ink:#e6f7ee;--mute:#86a893;--ac:#34d399;--acink:#032214;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#10b9815c,transparent 70%),radial-gradient(38% 42% at 92% 18%,#14b8a65c,transparent 70%),radial-gradient(48% 42% at 68% 100%,#84cc165c,transparent 70%),radial-gradient(30% 30% at 6% 80%,#14b8a65c,transparent 70%)}
[data-theme=rose]{--bg:#150a11;--bg2:#201019;--bg3:#2c1623;--line:#43213a;--ink:#ffeaf4;--mute:#c196ad;--ac:#f472b6;--acink:#2d0719;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#ec48995c,transparent 70%),radial-gradient(38% 42% at 92% 18%,#f43f5e5c,transparent 70%),radial-gradient(48% 42% at 68% 100%,#a855f75c,transparent 70%),radial-gradient(30% 30% at 6% 80%,#f43f5e5c,transparent 70%)}
[data-theme=gold]{--bg:#000;--bg2:#0a0a0a;--bg3:#141414;--line:#262626;--ink:#f5f5f5;--mute:#8a8a8a;--ac:#facc15;--acink:#201a00;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#facc154d,transparent 70%),radial-gradient(38% 42% at 92% 18%,#f973164d,transparent 70%),radial-gradient(48% 42% at 68% 100%,#a855f74d,transparent 70%),radial-gradient(30% 30% at 6% 80%,#f973164d,transparent 70%)}
[data-theme=crimson]{--bg:#120709;--bg2:#1d0d11;--bg3:#29141a;--line:#411f27;--ink:#ffecee;--mute:#bf969c;--ac:#f43f5e;--acink:#2c0309;--bad:#ff6b6b;--warn:#fbbf24;--mesh:radial-gradient(42% 38% at 12% 8%,#f43f5e5c,transparent 70%),radial-gradient(38% 42% at 92% 18%,#f973165c,transparent 70%),radial-gradient(48% 42% at 68% 100%,#a855f75c,transparent 70%),radial-gradient(30% 30% at 6% 80%,#f973165c,transparent 70%)}
[data-theme=paper]{--bg:#eef2f7;--bg2:#ffffff;--bg3:#f4f7fb;--line:#d9e0ea;--ink:#152033;--mute:#64748b;--ac:#2563eb;--acink:#ffffff;--bad:#dc2626;--warn:#d97706;--mesh:radial-gradient(42% 38% at 12% 8%,#3b82f64d,transparent 70%),radial-gradient(38% 42% at 92% 18%,#06b6d44d,transparent 70%),radial-gradient(48% 42% at 68% 100%,#a78bfa4d,transparent 70%),radial-gradient(30% 30% at 6% 80%,#06b6d44d,transparent 70%)}
[data-theme=mint]{--bg:#eaf5f1;--bg2:#ffffff;--bg3:#f1f9f6;--line:#cfe5dc;--ink:#10241d;--mute:#5f7d71;--ac:#0d9488;--acink:#ffffff;--bad:#dc2626;--warn:#d97706;--mesh:radial-gradient(42% 38% at 12% 8%,#14b8a64d,transparent 70%),radial-gradient(38% 42% at 92% 18%,#84cc164d,transparent 70%),radial-gradient(48% 42% at 68% 100%,#38bdf84d,transparent 70%),radial-gradient(30% 30% at 6% 80%,#84cc164d,transparent 70%)}
[data-theme=lilac]{--bg:#f1edfa;--bg2:#ffffff;--bg3:#f7f4fd;--line:#ddd3f1;--ink:#1f1535;--mute:#74669a;--ac:#7c3aed;--acink:#ffffff;--bad:#dc2626;--warn:#d97706;--mesh:radial-gradient(42% 38% at 12% 8%,#8b5cf64d,transparent 70%),radial-gradient(38% 42% at 92% 18%,#ec48994d,transparent 70%),radial-gradient(48% 42% at 68% 100%,#60a5fa4d,transparent 70%),radial-gradient(30% 30% at 6% 80%,#ec48994d,transparent 70%)}
[data-theme=blush]{--bg:#fbeef1;--bg2:#ffffff;--bg3:#fdf4f6;--line:#f0d5dc;--ink:#2e1119;--mute:#8a6270;--ac:#e11d48;--acink:#ffffff;--bad:#be123c;--warn:#d97706;--mesh:radial-gradient(42% 38% at 12% 8%,#fb71854d,transparent 70%),radial-gradient(38% 42% at 92% 18%,#f59e0b4d,transparent 70%),radial-gradient(48% 42% at 68% 100%,#c084fc4d,transparent 70%),radial-gradient(30% 30% at 6% 80%,#f59e0b4d,transparent 70%)}

*{box-sizing:border-box;margin:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{color:var(--ink);font-family:var(--font);line-height:1.5;min-height:100vh;overflow-x:hidden;background:var(--bg);transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(720px 380px at 50% -90px,color-mix(in srgb,var(--ac) 17%,transparent),transparent)}
button,input,select{font:inherit;color:inherit}
.hide,[hidden]{display:none!important}
.small{font-size:.84rem;color:var(--mute)}
svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 18px 24px;min-height:100vh;display:flex;flex-direction:column}
.wrap>*{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}

/* header */
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.lg{width:38px;height:38px;border-radius:12px;object-fit:cover;background:var(--bg3);flex:none}
.ctl{display:flex;gap:8px;align-items:center}
.icon{width:42px;height:42px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;transition:border-color .15s,background .15s,transform .1s}
.icon:hover{border-color:var(--ac)}.icon:active{transform:scale(.93)}
.icon[aria-pressed=true]{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.icon b{font-size:.95rem;font-weight:800}
.tdot{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--bg3) 50%,var(--ac) 50%);border:1px solid var(--line);display:block}
select{height:42px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:0 10px;cursor:pointer}
select option{background:var(--bg2);color:var(--ink)}

/* buttons / panels */
.btn{background:var(--ac);color:var(--acink);border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s,filter .15s;box-shadow:0 10px 22px -14px var(--ac)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ac);background:var(--bg3)}
.btn.sm{padding:8px 14px;font-size:.86rem;border-radius:10px}
.btn.lg{width:100%;padding:16px;font-size:1.05rem;border-radius:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 40px -30px rgba(0,0,0,.65)}
.panel>h2{font-size:1.02rem;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.head{margin-bottom:16px}.head h2{font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.status{display:inline-flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-size:.85rem;color:var(--mute);max-width:100%}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.dot.on{background:var(--ac);animation:pulse 1.8s infinite}.dot.off{background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.ic{display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,var(--bg3));color:var(--ac)}
.tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--warn) 13%,var(--bg2));border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:.9rem}
.tip::before{content:"⚠";color:var(--warn);font-weight:800}

/* home */
.home{max-width:760px;margin:0 auto;text-align:center;padding-top:6vh}
.home h1{font-size:clamp(2.1rem,6.5vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1.08;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.lead{color:var(--mute);margin:14px auto 34px;max-width:480px;font-size:1.05rem}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
@media(max-width:640px){.roles{grid-template-columns:1fr}}
.role{display:flex;align-items:center;gap:16px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;cursor:pointer;transition:transform .18s,border-color .2s,box-shadow .2s}
.role:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 24px 44px -28px color-mix(in srgb,var(--ac) 80%,transparent)}
.role:active{transform:scale(.985)}
.role .ic{width:60px;height:60px;border-radius:18px}.role .ic svg{width:28px;height:28px}
.role .rt{flex:1;min-width:0}.role .rt b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em}.role .rt span{color:var(--mute);font-size:.9rem}
.chev{color:var(--mute)}

/* code */
.codebox{display:flex;justify-content:center;gap:8px;margin:6px 0 14px;cursor:pointer}
.codebox b{flex:1;max-width:52px;min-width:0;height:62px;display:grid;place-items:center;font:700 1.9rem/1 "JetBrains Mono",Consolas,monospace;color:var(--ac);background:var(--bg3);border:1px solid var(--line);border-radius:13px;transition:background .2s,color .2s}
.codebox.cp b{background:var(--ac);color:var(--acink)}
@media(max-width:400px){.codebox{gap:5px}.codebox b{height:54px;font-size:1.5rem}}
input.code{background:var(--bg3);border:1px solid var(--line);border-radius:16px;width:100%;text-align:center;font:700 2.2rem/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.3em;padding:20px 8px 20px calc(8px + .3em);margin:4px 0 16px;color:var(--ac)}
input.code:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}

/* PC */
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.side{display:grid;gap:16px;counter-reset:st}
.side .panel>h2{display:flex;align-items:center;gap:10px}
.side .panel>h2::before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acink);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat:nth-child(3) b{color:var(--ac)}
.bin{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--bg3);transition:border-color .15s}
.item:hover{border-color:var(--ac)}
.thumb{width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--ac)}
.thumb:empty{animation:sh 1.2s ease-in-out infinite alternate}
@keyframes sh{to{background:color-mix(in srgb,var(--ac) 18%,var(--bg))}}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;cursor:pointer}
.meta{min-width:0}.meta b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#fff));border-radius:6px;transition:width .2s}
.acts a{display:block;text-align:center;font-size:.84rem;font-weight:700;padding:8px 14px;border-radius:10px;background:var(--ac);color:var(--acink);text-decoration:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;border:2px dashed var(--line);border-radius:18px;padding:54px 16px;text-align:center;color:var(--mute);margin-top:14px}
.empty svg{width:40px;height:40px;opacity:.5}

/* phone */
.phone{max-width:520px;margin:0 auto}
.drop{border:2px dashed color-mix(in srgb,var(--ac) 50%,var(--line));border-radius:22px;padding:28px 16px;text-align:center;background:color-mix(in srgb,var(--ac) 6%,transparent)}
.drop .up{width:64px;height:64px;border-radius:50%;margin:0 auto 12px}.drop .up svg{width:28px;height:28px}
.drop b{font-size:1.05rem}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pick .btn{padding:14px}
.qi{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qi .tn{width:52px;height:52px;border-radius:12px;background:var(--bg);overflow:hidden;display:grid;place-items:center;font-size:.7rem;color:var(--mute)}
.qi .tn img,.qi .tn video{width:100%;height:100%;object-fit:cover}
.qi b{font-size:.9rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total{position:sticky;bottom:12px;margin-top:16px;background:var(--bg3);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.total .bar{height:7px}
.ft{margin-top:auto;padding-top:34px;text-align:center;font-size:.82rem;font-weight:600;letter-spacing:.03em;color:var(--mute)}
@media(max-width:560px){.brand span{display:none}.icon{width:38px;height:38px}.ctl{gap:6px}select{height:38px;max-width:96px;padding:0 6px}.wrap{padding:12px 14px 20px}.panel{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="tb">
  <div class="brand"><img class="lg" alt=""><span>Media Beam</span></div>
  <div class="ctl">
    <button class="icon" id="backBtn" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="icon" id="lanBtn" aria-label="LAN mode" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="icon" id="themeBtn" aria-label="Theme"><i class="tdot"></i></button>
    <button class="icon" id="fontBtn" aria-label="Font"><b>Aa</b></button>
    <select id="langSel" aria-label="Language"></select>
  </div>
</header>

<main id="home" class="home">
  <h1 data-i="homeT"></h1>
  <p class="lead" data-i="homeS"></p>
  <div class="roles">
    <div class="role" id="btnMobile" role="button" tabindex="0"><div class="ic"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></div><div class="rt"><b data-i="mobName"></b><span data-i="mobDesc"></span></div><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
    <div class="role" id="btnPC" role="button" tabindex="0"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div><div class="rt"><b data-i="pcName"></b><span data-i="pcDesc"></span></div><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
  </div>
</main>

<section id="pc" class="hide">
  <div class="row sp head"><h2 data-i="recv"></h2><span class="status"><span class="dot" id="pcDot"></span><span id="pcStatus"></span></span></div>
  <div id="pathTip" class="tip hide"><span data-i="tipSlow"></span></div>
  <div class="grid">
    <aside class="side">
      <div class="panel" id="codePanel">
        <h2 data-i="codeT"></h2>
        <div class="codebox" id="pcCode" title="Copy"><b>·</b><b>·</b><b>·</b><b>·</b><b>·</b><b>·</b></div>
        <p class="small" data-i="codeH"></p>
        <button class="btn ghost sm" id="newCode" style="margin-top:14px"><span data-i="newCode"></span></button>
      </div>
      <div class="panel hide" id="connPanel"><h2 data-i="stConn"></h2><button class="btn ghost sm" id="newCode2"><span data-i="newCode"></span></button></div>
      <div class="panel">
        <h2 data-i="folderT"></h2>
        <button class="btn lg" id="pickDir"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i="folderBtn"></span></button>
        <p class="small" id="dirName" style="margin-top:12px"></p>
        <p class="small" data-i="folderTip" style="margin-top:6px;opacity:.8"></p>
      </div>
    </aside>
    <div class="panel">
      <div class="stats">
        <div class="stat"><span class="small" data-i="files"></span><b id="stFiles">0</b></div>
        <div class="stat"><span class="small" data-i="total"></span><b id="stSize">0 KB</b></div>
        <div class="stat"><span class="small" data-i="speed"></span><b id="stSpeed">0 MB/s</b></div>
      </div>
      <div class="row">
        <label class="btn sm" tabindex="0"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span data-i="sendPhone"></span><input type="file" id="pcFiles" multiple hidden></label>
        <button class="btn sm" id="dlAll" disabled><span data-i="dlAll"></span></button>
        <button class="btn ghost sm" id="clearAll" disabled><span data-i="clear"></span></button>

/* kis raaste se data ja raha hai: lan / net (internet) / relay */
async function pathKind(c){
  try{
    const st = await c.peerConnection.getStats(); let sel = null;
    st.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) sel = st.get(r.selectedCandidatePairId); });
    if (!sel) st.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) sel = r; });
    if (!sel) return null;
    const l = st.get(sel.localCandidateId), r = st.get(sel.remoteCandidateId);
    if (!l || !r) return null;
    if (l.candidateType === 'relay' || r.candidateType === 'relay') return 'relay';
    return l.candidateType === 'host' && r.candidateType === 'host' ? 'lan' : 'net';
  }catch(e){ return null; }
}

  // refresh ho ya net jaye: wahi code wapas register hota hai

    sessionStorage.setItem('mb_code', code); setCode(code); setSt('pc', 'stMake');
    const me = peer = new Peer(PREFIX + code, ICE), retry = ms => { if (peer === me) pT = setTimeout(() => makePeer(false), ms); };

    me.on('disconnected', () => { if (peer === me) try{ me.reconnect(); }catch(e){} });
    me.on('close', () => retry(1500));
    me.on('error', e => { if (peer !== me) return; if (e.type === 'unavailable-id') retry(2500); else if (/network|server|socket/.test(e.type)) retry(3000); else setSt('pc', 'stErr', 'off', e.type); });
    me.on('connection', c => {
      conns.push(c); openConns++; setSt('pc', 'stConn', 'on'); if (conns.length === 1) checkPath(c);
      $('codePanel').classList.add('hide'); $('connPanel').classList.remove('hide'); clearTimeout(showCodeT);   // connect ho gaya: code chhupa do
      txHook(c);
      c.on('data', d => onData(d, c));

          setSt('pc', 'stRetry', 'off');

  }
  $('newCode').onclick = () => makePeer(true); $('newCode2').onclick = () => makePeer(true); makePeer(false);
  window.addEventListener('online', () => { if (peer && peer.disconnected) try{ peer.reconnect(); }catch(e){} });

  /* ================= PC -> PHONE (bhejna) ================= */
  const txJobs = [], tm = meter(); let txCS = 64 * 1024, txResync = false, txSession = false, showCodeT = null;
  const txEnded = j => j.state === 'removed' || j.state === 'done';
  function txAnnounce(j, c){
    j.ready = false; j.next = 0; j.sent = 0; j.have = new Set(); if (j.state === 'send' || j.state === 'sent') j.state = 'wait';
    try{ (c || conns.find(x => x.open)).send(JSON.stringify({ t:'meta', id:j.id, key:j.key, name:j.f.name, size:j.f.size, type:j.f.type || guessType(j.f.name), cs:j.cs })); }catch(e){}
  }
  function txHook(c){
    const go = () => {
      txWorker(c);
      if (txSession) return; txSession = true;
      try{ const mx = c.peerConnection.sctp.maxMessageSize; if (mx) txCS = Math.max(16 * 1024, Math.min(256 * 1024, mx) - 16); }catch(e){}
      txJobs.forEach(j => { if (txEnded(j)) return; if (!j.started){ j.cs = txCS; j.n = Math.ceil(j.f.size / j.cs); } txAnnounce(j, c); });
    };
    if (c.open) go(); else c.on('open', go);
  }
  function txTake(){
    for (const j of txJobs){
      if (!j.ready || txEnded(j) || j.state === 'sent') continue;
      while (j.next < j.n && j.have.has(j.next)) j.next++;
      if (j.next < j.n){
        const idx = j.next; let cnt = 1;
        while (cnt < 8 && idx + cnt < j.n && !j.have.has(idx + cnt)) cnt++;
        j.next += cnt; if (j.state === 'wait') j.state = 'send'; j.started = true;
        return { j, idx, cnt };
      }
    }
    return null;
  }
  async function txWorker(conn){
    const dc = conn.dataChannel;
    while (conn.open && conns.includes(conn)){
      const tk = txTake();
      if (!tk){
        if (txResync && conns.every(x => !x.open || x.dataChannel.bufferedAmount === 0)){ txResync = false; txJobs.forEach(j => { if (!txEnded(j)) txAnnounce(j, conn); }); }
        await sleep(40); continue;
      }
      const { j, idx, cnt } = tk, start = idx * j.cs, end = Math.min(start + cnt * j.cs, j.f.size);
      try{
        const big = await j.f.slice(start, end).arrayBuffer();
        for (let k = 0; k < cnt; k++){
          const off = k * j.cs, len = Math.min(j.cs, big.byteLength - off);
          if (len <= 0) break;
          const msg = new ArrayBuffer(8 + len), dv = new DataView(msg);
          dv.setUint32(0, j.id); dv.setUint32(4, idx + k); new Uint8Array(msg, 8).set(new Uint8Array(big, off, len));
          while (dc.bufferedAmount > 4 * 1024 * 1024 && conn.open){
            dc.bufferedAmountLowThreshold = 1024 * 1024;
            await new Promise(r => { const h = () => { dc.removeEventListener('bufferedamountlow', h); r(); }; dc.addEventListener('bufferedamountlow', h); setTimeout(h, 250); });
          }
          if (!conn.open){ txResync = true; return; }
          conn.send(msg); j.sent += len; tm.add(len);
          if (j.sent >= j.f.size && j.state !== 'done') j.state = 'sent';
        }
      }catch(e){ txResync = true; if (!conn.open) break; await sleep(100); }
    }
  }
  function txBuildRow(j){
    const r = document.createElement('div'); r.className = 'qi';
    r.innerHTML = '<div class="tn"></div><div><b></b><span class="small"></span><div class="bar"><i></i></div></div><button class="btn ghost sm">✕</button>';
    r.querySelector('b').textContent = j.f.name; const k = kindOf(j.f.type, j.f.name);
    r.querySelector('.tn').textContent = k === 'video' ? 'VID' : k === 'image' ? 'IMG' : 'FILE';
    r.querySelector('button').onclick = () => { if (j.state !== 'send'){ j.state = 'removed'; r.remove(); } };
    j.row = { sub: r.querySelector('.small'), bar: r.querySelector('.bar i'), root: r }; $('txList').appendChild(r);
  }
  $('pcFiles').onchange = e => {

    for (const f of e.target.files){
      if (!f.size) continue;
      const j = { id: rid(), key: f.name + '|' + f.size + '|' + f.lastModified, f, cs: txCS, n: Math.ceil(f.size / txCS), next: 0, sent: 0, state: 'wait', ready: false, have: new Set() };

  };
  setInterval(() => {
    txJobs.forEach(j => {
      if (j.state === 'removed' || (j.state === 'done' && j.pd === S.lang)) return;
      const sv = j.state === 'done' ? j.f.size : (j.mx = Math.max(j.mx || 0, Math.min(j.sent, j.f.size))), p = j.f.size ? Math.min(100, sv / j.f.size * 100) : 0;

  }, 4000);

  setInterval(() => { const c = conns.find(x => x.open); if (c) try{ c.send('{"t":"ka"}'); }catch(e){} }, 3000);

  async function checkPath(c){

  }

  async function freeName(d, name){
    const i = name.lastIndexOf('.'), b = i > 0 ? name.slice(0,i) : name, e = i > 0 ? name.slice(i) : '';
    let n = name, k = 0;
    while (true){
      let exists = reserved.has(n);
      if (!exists){ try{ await d.getFileHandle(n); exists = true; }catch(_){} }
      if (!exists){ reserved.add(n); return n; }
      k++; n = `${b}_${k}${e}`;
    }
  }

  function onData(d, c){
    if (typeof d === 'string'){
      const msg = JSON.parse(d);
      if (msg.t === 'ping'){ try{ c.send('{"t":"pong"}'); }catch(e){} return; }
      if (msg.t === 'have' || msg.t === 'ok'){
        const tj = txJobs.find(x => x.id === msg.id);
        if (tj && !txEnded(tj)){
          if (msg.t === 'ok') tj.state = 'done';
          else { tj.have = new Set(msg.list); tj.sent = Math.min(tj.f.size, tj.have.size * tj.cs); tj.next = 0; tj.ready = true; if (tj.have.size >= tj.n) tj.state = 'sent'; }
        }
        return;
      }
      if (msg.t !== 'meta') return;
      let F = files.get(msg.key);
      if (!F){   // nayi file; purani ho to wahi se resume hoti hai
        if (!dir && msg.size > 5e8) setSt('pc', 'bigFile', 'off');
        const name = safeName(msg.name);
        F = { id: msg.id, key: msg.key, name, size: msg.size, type: msg.type, cs: msg.cs, kind: kindOf(msg.type, name), got: 0, chunks: [], pend: new Map(), have: new Set(), w: null, chain: Promise.resolve(), state: 'recv', fin: false };
        F.nc = Math.ceil(F.size / F.cs);
        files.set(msg.key, F); F.el = addCard(F);
        F.ready = (async () => {
          if (!dir) return;
          try{
            const nm = await freeName(dir, name);
            F.fh = await dir.getFileHandle(nm, { create:true });
            F.w = await F.fh.createWritable(); F.saved = true; F.shown = nm;
          }catch(e){ F.w = null; F.saved = false; }
        })();
      }
      byId.set(msg.id, F);
      try{
        c.send(JSON.stringify({ t:'have', id: msg.id, list: F.state === 'done' ? Array.from({ length: F.nc }, (_, i) => i) : [...F.have] }));
        if (F.state === 'done') c.send(JSON.stringify({ t:'ok', id: msg.id }));
      }catch(e){}
      return;
    }
    const dv = new DataView(d), id = dv.getUint32(0), idx = dv.getUint32(4), F = byId.get(id);
    if (!F || F.state !== 'recv' || F.have.has(idx)) return;
    F.have.add(idx);
    const payload = new Uint8Array(d, 8);
    F.ready.then(() => {
      if (F.w){   // 16 chunk (~4MB) ka block ban jaye tab ek hi baar disk par likho: bahut tez
        const bk = (idx / 16) | 0, lo = bk * 16, hi = Math.min(lo + 16, F.nc);
        let pb = F.pend.get(bk); if (!pb){ pb = { parts: new Array(hi - lo), n: 0, need: hi - lo }; F.pend.set(bk, pb); }
        pb.parts[idx - lo] = payload; pb.n++;
        if (pb.n === pb.need){ F.pend.delete(bk); const blob = new Blob(pb.parts); F.chain = F.chain.then(() => F.w.write({ type:'write', position: lo * F.cs, data: blob })); }
      } else F.chunks[idx] = payload;
      F.got += payload.byteLength; totalBytes += payload.byteLength; m.add(payload.byteLength);
      F.proc = (F.proc || 0) + 1;

  }

  async function finish(F){

    done.push(F); $('dlAll').disabled = $('clearAll').disabled = false; beep();
  }

  function addCard(F){
    $('empty').classList.add('hide');
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = '<div class="thumb"></div><div class="meta"><b></b><span class="small"></span><div class="bar"><i></i></div></div><div class="acts"></div>';

  }

  setInterval(() => {

      else if (F.state === 'done'){ if (F.subL !== S.lang){ F.subL = S.lang; F.el.sub.textContent = fmt(F.size) + (F.saved ? ' · ' + t('savedAs', F.shown) : ''); } }

  $('pickDir').onclick = async () => {
    if (!window.showDirectoryPicker){ alert(t('noFS')); return; }
    try{ dir = await showDirectoryPicker({ id:'mediabeam', mode:'readwrite', startIn:'desktop' }); folderName = dir.name; renderSt(); }catch(e){}
  };
}

/* ================= MOBILE ================= */
function startPhone(){
  $('phone').classList.remove('hide'); setSt('ph', 'stEnter');
  let peer = null, timer = null, retryT = null, wl = null, opened = 0, code = null, linked = false, lastRx = 0, thumbN = 0, resync = false, shownTot = 0;
  const conns = [], jobs = [], m = meter(), saved = sessionStorage.getItem('mb_pcode');
  const ended = j => j.state === 'removed' || j.state === 'done' || j.state === 'error';
  $('codeIn').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g,'').slice(0,6));
  $('codeIn').focus();

  function link(c){
    code = c; clearTimeout(retryT); retryT = null; clearTimeout(timer);
    const old = peer; peer = null; if (old) try{ old.destroy(); }catch(e){}
    conns.length = 0; opened = 0; lastRx = Date.now();
    $('connectBtn').disabled = true; setSt('ph', linked ? 'stRetry' : 'stConnecting');
    const me = peer = new Peer(ICE);
    me.on('open', () => {
      if (peer !== me) return;
      timer = setTimeout(() => { if (peer === me && !opened) fail(); }, 12000);
      for (let i = 0; i < PAR; i++){
        const c = me.connect(PREFIX + code, { reliable:true, serialization:'raw' });
        conns.push(c);
        let was = false;
        c.on('open', () => { if (peer !== me) return; was = true; opened++; if (opened === 1) onFirst(c); worker(c); });
        c.on('data', d => onMsg(d, c));
        c.on('close', () => { if (peer !== me || !was) return; opened--; if (opened <= 0) drop('saare channel band hue'); else resync = true; });
      }
    });
    me.on('disconnected', () => { if (peer === me) try{ me.reconnect(); }catch(e){} });
    me.on('error', e => {
      if (peer !== me || opened) return;
      if (e.type === 'peer-unavailable' && !linked){ setSt('ph', 'stWrong', 'off'); $('connectBtn').disabled = false; return; }
      fail();
    });
  }
  function fail(){ if (!linked){ setSt('ph', 'stNo', 'off'); $('connectBtn').disabled = false; return; } retry(); }
  function retry(){
    if (retryT) return; setSt('ph', 'stRetry'); $('connectBtn').disabled = false;
    retryT = setTimeout(() => { retryT = null; link(code); }, 2000);
  }
  // koi bhi connection tute: sab band karo aur apne aap dobara judo; files wahin se resume
  let dbgN = 0;
  function drop(why){
    dbgN++; const dg = $('dbg'); dg.classList.remove('hide'); dg.textContent = '↻ reconnect #' + dbgN + ' · ' + (why || '?') + ' · ' + new Date().toLocaleTimeString();
    const old = peer; peer = null; if (old) try{ old.destroy(); }catch(e){}
    opened = 0; conns.length = 0; jobs.forEach(j => j.ready = false); retry();
  }
  async function phPath(c){
    for (const w of [2000, 4000, 8000]){
      await sleep(w); if (opened <= 0) return;
      const k = await pathKind(c); if (!k) continue;
      $('phTip').classList.toggle('hide', k === 'lan');
    }
  }
  function onFirst(c){
    clearTimeout(timer); linked = true; sessionStorage.setItem('mb_pcode', code);
    setSt('ph', 'stOk', 'on'); $('codeStep').classList.add('hide'); $('sendStep').classList.remove('hide'); keepAwake();
    try{ const mx = c.peerConnection.sctp.maxMessageSize; if (mx) CP = Math.max(16 * 1024, Math.min(256 * 1024, mx) - 16); }catch(e){}
    jobs.forEach(j => { if (!ended(j)) announce(j, c); });
    phPath(c);
  }
  function announce(j, c){
    j.ready = false; j.next = 0; j.sent = 0; j.have = new Set(); if (j.state === 'send' || j.state === 'sent') j.state = 'wait';
    try{ (c || conns.find(x => x.open)).send(JSON.stringify({ t:'meta', id:j.id, key:j.key, name:j.f.name, size:j.f.size, type:j.f.type || guessType(j.f.name), cs:j.cs })); }catch(e){}
  }
  function onMsg(d, c){
    lastRx = Date.now();

    const x = JSON.parse(d);
    if (x.t === 'meta'){ rxMeta(x, c); return; }
    const j = jobs.find(j => j.id === x.id);
    if (x.t === 'ok' && j) j.state = 'done';
    else if (x.t === 'have' && j && !ended(j)){
      j.have = new Set(x.list); j.sent = Math.min(j.f.size, j.have.size * j.cs); j.next = 0; j.ready = true;
      if (j.have.size >= j.n) j.state = 'sent';
    }
  }
  setInterval(() => {
    if (opened <= 0) return;

    if (open.length){ open.sort((a, b) => a.dataChannel.bufferedAmount - b.dataChannel.bufferedAmount); try{ open[0].send('{"t":"ping"}'); }catch(e){} }

    });

  window.addEventListener('online', () => { if (linked && opened === 0){ clearTimeout(retryT); retryT = null; link(code); } });

  function connect(){

  function addFiles(list){

      jobs.push(j); buildRow(j); if (j.state === 'wait' && opened > 0) announce(j);

  $('fAny').onchange = e => { addFiles(e.target.files); e.target.value = ''; };

  function buildRow(j){
    const r = document.createElement('div'); r.className = 'qi';

    r.querySelector('b').textContent = j.f.name;

    if (k !== 'other' && thumbN++ < 30){ const el = document.createElement(k === 'video' ? 'video' : 'img'); el.src = URL.createObjectURL(j.f) + (k === 'video' ? '#t=0.1' : ''); if (k === 'video'){ el.muted = true; el.preload = 'metadata'; } else { el.decoding = 'async'; el.loading = 'lazy'; } tn.appendChild(el); } else tn.textContent = k === 'video' ? 'VID' : k === 'image' ? 'IMG' : 'FILE';
    r.querySelector('button').onclick = () => { if (j.state === 'wait' || j.state === 'error' || j.state === 'done'){ j.state = 'removed'; r.remove(); } };

  }

  /* ================= PC -> PHONE (receive) ================= */
  const rxByKey = new Map(), rxById = new Map(), rxm = meter(), hasOPFS = !!(navigator.storage && navigator.storage.getDirectory);
  function rxBuildRow(F){
    if ($('rxEmpty')) $('rxEmpty').remove();
    const r = document.createElement('div'); r.className = 'qi'; r.style.gridTemplateColumns = '1fr auto';
    r.innerHTML = '<div><b></b><span class="small"></span><div class="bar"><i></i></div></div><span class="act"></span>';

  function rxMeta(x, c){

      F.nc = Math.ceil(F.size / F.cs); rxByKey.set(x.key, F); rxBuildRow(F);
      F.ready = (async () => {
        if (!hasOPFS) return;   // phone ki apni disk par likhta hai, RAM me nahi
        try{ const root = await navigator.storage.getDirectory(); F.fh = await root.getFileHandle('mb_' + x.id + '_' + Date.now(), { create:true }); F.w = await F.fh.createWritable(); }

    try{
      c.send(JSON.stringify({ t:'have', id: x.id, list: F.state === 'done' ? Array.from({ length: F.nc }, (_, i) => i) : [...F.have] }));
      if (F.state === 'done') c.send(JSON.stringify({ t:'ok', id: x.id }));
    }catch(e){}
  }
  function rxChunk(d){
    const dv = new DataView(d), id = dv.getUint32(0), idx = dv.getUint32(4), F = rxById.get(id);
    if (!F || F.state !== 'recv' || F.have.has(idx)) return;
    F.have.add(idx);
    const payload = new Uint8Array(d, 8);
    F.ready.then(() => {
      if (F.w){
        const bk = (idx / 16) | 0, lo = bk * 16, hi = Math.min(lo + 16, F.nc);
        let pb = F.pend.get(bk); if (!pb){ pb = { parts: new Array(hi - lo), n: 0, need: hi - lo }; F.pend.set(bk, pb); }
        pb.parts[idx - lo] = payload; pb.n++;
        if (pb.n === pb.need){ F.pend.delete(bk); const blob = new Blob(pb.parts); F.chain = F.chain.then(() => F.w.write({ type:'write', position: lo * F.cs, data: blob })); }
      } else F.chunks[idx] = payload;
      F.got += payload.byteLength; rxm.add(payload.byteLength); F.proc++;
      if (F.proc >= F.nc) rxFinish(F);
    });
  }
  async function rxFinish(F){
    if (F.fin) return; F.fin = true;
    let blob;
    try{ if (F.w){ await F.chain; await F.w.close(); blob = await F.fh.getFile(); } else blob = new Blob(F.chunks, { type: F.type }); }
    catch(e){ F.state = 'err'; F.sub.textContent = 'save error'; return; }
    F.chunks = []; F.state = 'done';
    const ack = conns.find(c => c.open); if (ack) try{ ack.send(JSON.stringify({ t:'ok', id: F.id })); }catch(e){}
    const a = document.createElement('a'); a.className = 'btn sm'; a.href = URL.createObjectURL(blob); a.download = F.name; a.dataset.i = 'rxSave'; a.textContent = t('rxSave');
    F.act.appendChild(a); F.bar.style.width = '100%'; F.sub.textContent = fmt(F.size) + ' · ' + t('rxDone');
  }
  setInterval(() => rxByKey.forEach(F => { if (F.state === 'recv'){ F.bar.style.width = (F.size ? F.got / F.size * 100 : 0) + '%'; F.sub.textContent = fmt(F.got) + ' / ' + fmt(F.size) + ' · ' + (rxm.rate() / 1e6).toFixed(1) + ' MB/s'; } }), 300);

  const RUN = 8;   // ek baar me 8 chunk (~2MB) storage se padho
  function take(){
    for (const j of jobs){
      if (!j.ready || ended(j) || j.state === 'sent') continue;
      while (j.next < j.n && j.have.has(j.next)) j.next++;
      if (j.next < j.n){
        const idx = j.next; let cnt = 1;
        while (cnt < RUN && idx + cnt < j.n && !j.have.has(idx + cnt)) cnt++;
        j.next += cnt; if (j.state === 'wait') j.state = 'send';
        return { j, idx, cnt };
      }
    }
    return null;
  }
  async function worker(conn){
    const dc = conn.dataChannel;
    while (conn.open && conns.includes(conn)){
      const tk = take();
      if (!tk){
        if (resync && conns.every(x => !x.open || x.dataChannel.bufferedAmount === 0)){ resync = false; jobs.forEach(j => { if (!ended(j)) announce(j, conn); }); }
        await sleep(40); continue;
      }
      const { j, idx, cnt } = tk, start = idx * j.cs, end = Math.min(start + cnt * j.cs, j.f.size);
      try{
        const big = await j.f.slice(start, end).arrayBuffer();
        for (let k = 0; k < cnt; k++){
          const off = k * j.cs, len = Math.min(j.cs, big.byteLength - off);
          if (len <= 0) break;
          const msg = new ArrayBuffer(8 + len), dv = new DataView(msg);
          dv.setUint32(0, j.id); dv.setUint32(4, idx + k); new Uint8Array(msg, 8).set(new Uint8Array(big, off, len));
          while (dc.bufferedAmount > 4 * 1024 * 1024 && conn.open){   // buffer bhara hai to RUKO (pehle 200ms baad bhej deta tha)
            dc.bufferedAmountLowThreshold = 1024 * 1024;
            await new Promise(r => { const h = () => { dc.removeEventListener('bufferedamountlow', h); r(); }; dc.addEventListener('bufferedamountlow', h); setTimeout(h, 250); });
          }
          if (!conn.open){ resync = true; return; }
          conn.send(msg);
          j.sent += len; m.add(len);
          if (j.sent >= j.f.size && j.state !== 'done') j.state = 'sent';
        }
      }catch(e){ resync = true; if (!conn.open) break; await sleep(100); }
    }
  }

  $('clearDone').onclick = () => jobs.forEach(j => { if (j.state === 'done'){ j.state = 'removed'; j.row.root.remove(); } });

  setInterval(() => {
    let tot = 0, sent = 0, doneN = 0, live = 0;
    jobs.forEach(j => {
      if (j.state === 'removed') return;
      live++; tot += j.f.size;
      const sv = j.state === 'done' ? j.f.size : (j.mx = Math.max(j.mx || 0, Math.min(j.sent, j.f.size)));
      sent += sv;
      if (j.state === 'done' && j.pd === S.lang){ doneN++; return; }
      const p = j.f.size ? Math.min(100, sv / j.f.size * 100) : 0;
      j.row.bar.style.width = (j.state === 'done' ? 100 : p) + '%';
      const txt = { wait:t('qWait'), send:Math.round(p) + '%', sent:t('qSave'), done:t('qDone'), error:t('qEmpty') }[j.state];
      j.row.sub.textContent = fmt(j.f.size) + ' · ' + txt;
      if (j.state === 'done'){ doneN++; j.pd = S.lang; }
    });
    $('phSummary').textContent = live ? t('sumN', doneN, live) : t('sumNone');
    let infl = 0; conns.forEach(c => { try{ if (c.open) infl += c.dataChannel.bufferedAmount; }catch(e){} });
    sent = Math.max(0, sent - infl);
    if (!live) shownTot = 0; else { shownTot = Math.max(shownTot, sent); sent = Math.min(shownTot, tot); }
    const pct = tot ? Math.round(sent / tot * 100) : 0, r = m.rate();
    $('totBar').style.width = pct + '%'; $('totTxt').textContent = pct + '%';
    const rem = tot - sent; $('totSpeed').textContent = r > 1e4 ? (r/1e6).toFixed(1) + ' MB/s · ' + (rem > 0 ? t('left', Math.ceil(rem / r)) : t('fin')) : '';
  }, 250);

  if (saved){ $('codeIn').value = saved; linked = true; link(saved); }
}

// page refresh ho jaye to wahi screen aur wahi code wapas
(() => { const r = sessionStorage.getItem('mb_role'); if (r === 'pc') go(startPC); else if (r === 'phone') go(startPhone); })();
</script>
